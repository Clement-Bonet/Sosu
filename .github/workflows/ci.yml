name: CI

# main: stable; dev: integration; feature/*: one branch per feature, merged into dev
# through a pull request. Pull requests are checked before they are merged.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  linux:
    name: Linux (${{ matrix.cc }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      SOSU_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: make test
      - name: Install SDL3
        timeout-minutes: 5  # a stalled apt mirror fails the job instead of hanging it
        run: |
          # a stalled mirror gives up after 30 s and is retried, instead of hanging the job
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends libsdl3-dev
      # The dummy video driver needs no screen: the window opens, draws a frame and closes itself.
      - name: Window test (platform)
        timeout-minutes: 3
        env:
          SDL_VIDEO_DRIVER: dummy
        run: ./build/sosuc run tests/window

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        shell: cmd
        run: build.bat test
      - name: Download SDL3
        timeout-minutes: 5
        shell: pwsh
        run: ./packages/platform/fetch-sdl3.ps1
      - name: Window test (platform)
        timeout-minutes: 3
        shell: cmd
        env:
          SDL_VIDEO_DRIVER: dummy
        run: build\sosuc.exe run tests\window
