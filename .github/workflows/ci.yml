name: CI

# main: stable; dev: integration; feature/*: one branch per feature, merged into dev
# through a pull request. Pull requests are checked before they are merged.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  linux:
    name: Linux (${{ matrix.cc }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      SOSU_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: make test

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        shell: cmd
        run: build.bat test
