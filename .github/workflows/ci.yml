name: CI

# main: stable; dev: integration; feature/*: one branch per feature, merged into dev
# through a pull request. Pull requests are checked before they are merged.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# The jobs only read the repository: a workflow run by a pull request from a fork gets no more.
permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.cc }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      SOSU_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: make test
      # Sosu declares the SDL functions itself and needs no header: the library is enough
      # (libsdl3-dev pulls in some 170 packages, slow when the mirror is). The link libSDL3.so,
      # which -lSDL3 looks for, comes with libsdl3-dev: it is made by hand.
      - name: Install SDL3
        timeout-minutes: 8  # a stalled apt mirror fails the job instead of hanging it
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends libsdl3-0
          sudo ln -sf "$(ls /usr/lib/x86_64-linux-gnu/libSDL3.so.0)" /usr/local/lib/libSDL3.so
          sudo ldconfig
      # The dummy video driver needs no screen: the window opens, draws a frame and closes itself.
      - name: Window test (platform)
        timeout-minutes: 3
        env:
          SDL_VIDEO_DRIVER: dummy
        run: ./build/sosuc run tests/window

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        shell: cmd
        run: build.bat test
      - name: Download SDL3
        timeout-minutes: 5
        shell: pwsh
        run: ./packages/platform/fetch-sdl3.ps1
      - name: Window test (platform)
        timeout-minutes: 3
        shell: cmd
        env:
          SDL_VIDEO_DRIVER: dummy
        run: build\sosuc.exe run tests\window
