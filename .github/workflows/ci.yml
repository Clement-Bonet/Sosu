name: CI

# main: stable; dev: integration; feature/*: one branch per feature, merged into dev
# through a pull request. Pull requests are checked before they are merged.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# The jobs only read the repository: a workflow run by a pull request from a fork gets no more.
permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.cc }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      SOSU_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      # Sosu declares the SDL functions itself and needs no header: the library is enough
      # (libsdl3-dev pulls in some 170 packages, slow when the mirror is). The link libSDL3.so,
      # which -lSDL3 looks for, comes with libsdl3-dev: it is made by hand. The tests package a
      # program of `platform` (spec 11.6): SDL comes first.
      - name: Install SDL3
        timeout-minutes: 8  # a stalled apt mirror fails the job instead of hanging it
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends libsdl3-0
          sudo ln -sf "$(ls /usr/lib/x86_64-linux-gnu/libSDL3.so.0)" /usr/local/lib/libSDL3.so
          sudo ldconfig
      - name: Build and test
        run: make test
      # The time of sosuc on programs of 5 000 to 80 000 lines, in the summary of the job
      # (work 5 of spec 13.1); it fails if the time grows much faster than the program.
      - name: The time of sosuc on large programs
        if: matrix.cc == 'gcc'
        timeout-minutes: 5
        run: make bench
      - name: docs/REFERENCE.md is up to date
        if: matrix.cc == 'gcc'
        run: |
          make doc
          git diff --exit-code docs/REFERENCE.md || { echo "::error::run make doc and commit docs/REFERENCE.md"; exit 1; }
      # The dummy video driver needs no screen: the window opens, draws a frame and closes itself.
      - name: Window test (platform)
        timeout-minutes: 3
        env:
          SDL_VIDEO_DRIVER: dummy
        run: ./build/sosuc run tests/window
      # Cross-compilation (spec 11.6): another architecture of the same system.
      # The C compiler for ARM64 (58 MB, slow when the mirror is): in the gcc job only, which uses it.
      - name: Install the C compiler for ARM64
        if: matrix.cc == 'gcc'
        timeout-minutes: 15
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: A program for linux-arm64
        if: matrix.cc == 'gcc'
        env:
          SOSU_CC: ""
        run: |
          ./build/sosuc build --target linux-arm64 tests/programs/basics
          file tests/programs/basics/build/linux-arm64/basics | grep -q "ARM aarch64"
      - name: Archive of examples/workspace
        if: matrix.cc == 'gcc'
        run: ./build/sosuc package examples/workspace
      - uses: actions/upload-artifact@v7
        if: matrix.cc == 'gcc'
        with:
          name: workspace-linux-x64
          path: examples/workspace/build/package/workspace-linux-x64.tar.gz

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The tests package a program of `platform` (spec 11.6): SDL comes first.
      - name: Download SDL3
        timeout-minutes: 5
        shell: pwsh
        run: ./packages/platform/fetch-sdl3.ps1
      - name: Build and test
        shell: cmd
        run: build.bat test
      - name: Window test (platform)
        timeout-minutes: 3
        shell: cmd
        env:
          SDL_VIDEO_DRIVER: dummy
        run: build\sosuc.exe run tests\window
      # Cross-compilation (spec 11.6): the tools of MSVC for ARM64, from x64.
      - name: A program for windows-arm64
        shell: pwsh
        run: |
          ./build/sosuc.exe build --target windows-arm64 tests/programs/basics
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes("tests/programs/basics/build/windows-arm64/basics.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0xAA64) { Write-Error "not an ARM64 program: machine $machine"; exit 1 }
      - name: Archive of examples/workspace
        shell: cmd
        run: build\sosuc.exe package examples\workspace
      - uses: actions/upload-artifact@v7
        with:
          name: workspace-windows-x64
          path: examples/workspace/build/package/workspace-windows-x64.zip

  macos:
    name: macOS (clang)
    runs-on: macos-latest
    env:
      CC: clang
      SOSU_CC: clang
    steps:
      - uses: actions/checkout@v7
      # The tests package a program of `platform` (spec 11.6): SDL comes first. Homebrew keeps
      # its libraries out of the default paths of the linker: LIBRARY_PATH gives it.
      - name: Install SDL3
        timeout-minutes: 8
        run: |
          brew install sdl3
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Build and test
        run: make test
      - name: Window test (platform)
        timeout-minutes: 3
        env:
          SDL_VIDEO_DRIVER: dummy
        run: ./build/sosuc run tests/window
      # Cross-compilation (spec 11.6): both architectures in one program.
      - name: A program for macos-universal
        run: |
          ./build/sosuc build --target macos-universal tests/programs/basics
          lipo -info tests/programs/basics/build/macos-universal/basics | grep -q "x86_64 arm64"
      - name: Archive of examples/workspace
        run: ./build/sosuc package examples/workspace
      - uses: actions/upload-artifact@v7
        with:
          name: workspace-macos
          path: examples/workspace/build/package/workspace-macos-*.zip
      # iOS (spec 11.5): the application of examples/window for the simulator, linked with the
      # SDL3.xcframework of the disk image of SDL. Running it in the simulator is done by hand.
      - name: iOS simulator application (examples/window)
        timeout-minutes: 10
        run: |
          sh packages/platform/fetch-sdl3-apple.sh
          ./build/sosuc package --target ios-sim examples/window
          test -x examples/window/build/ios/window.app/window

  # Android (spec 11.5): the NDK and the SDK of the image build examples/window up to its APK.
  # Running it on an emulator is done by hand.
  android:
    name: Android (NDK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build sosuc
        run: make build/sosuc
      - name: Download SDL3 for Android
        timeout-minutes: 5
        run: sh packages/platform/fetch-sdl3-android.sh
      - name: APK of examples/window
        timeout-minutes: 20
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          ./build/sosuc package --target android examples/window
          test -f examples/window/build/android/project/app/build/outputs/apk/debug/app-debug.apk

  # The parser, the semantic analysis and code generation fuzzed (work 5 of spec 13.1): three
  # minutes of libFuzzer with the sanitizers of addresses and undefined behaviour, from the inputs
  # found by the runs before (a cache). An input that crashes is kept as an artifact: once fixed,
  # it goes to tests/fuzz/, which `make test` replays.
  fuzz:
    name: Fuzzing (libFuzzer)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            build/fuzz_corpus
            build/fuzz_ogg_corpus
            build/fuzz_manifest_corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz
        timeout-minutes: 10
        run: make fuzz FUZZ_TIME=180
      # the Ogg Vorbis decoder of the package audio, C written elsewhere (stb_vorbis)
      - name: Fuzz the Ogg decoder
        timeout-minutes: 5
        run: make fuzz-ogg FUZZ_TIME=120
      # sosu.toml, which comes with every git dependency
      - name: Fuzz sosu.toml
        timeout-minutes: 3
        run: make fuzz-manifest FUZZ_TIME=60
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: build/fuzz_crashes
