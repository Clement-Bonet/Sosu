name: Fuzzing (nightly)

# The fuzzing of the CI (ci.yml) runs a few minutes on each push; this one runs each target half an
# hour, once a night, from the same corpus (the cache), which it grows for the next runs. Also run
# by hand from the Actions tab (Run workflow).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzzing (libFuzzer, 30 minutes a target)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            build/fuzz_corpus
            build/fuzz_ogg_corpus
            build/fuzz_coded_corpus
            build/fuzz_manifest_corpus
            build/fuzz_ui_corpus
            build/fuzz_bindgen_corpus
            build/fuzz_lsp_corpus
            build/fuzz_gltf_corpus
            build/fuzz_obj_corpus
            build/fuzz_fbx_corpus
            build/fuzz_sofa_corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz the compiler
        timeout-minutes: 40
        run: make fuzz FUZZ_TIME=1800
      - name: Fuzz the Ogg decoder
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: make fuzz-ogg FUZZ_TIME=1800
      - name: Fuzz the MP3 and FLAC decoders
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: make fuzz-coded FUZZ_TIME=1800
      - name: Fuzz sosu.toml
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: make fuzz-manifest FUZZ_TIME=1800
      - name: Fuzz the interface files
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: make fuzz-ui FUZZ_TIME=1800
      - name: Fuzz bindgen
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: make fuzz-bindgen FUZZ_TIME=1800
      - name: Fuzz the language server
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: make fuzz-lsp FUZZ_TIME=1800
      # the SOFA target is a program of the package audio, linked with SDL3 by `platform`: the
      # library alone, as the job of Linux takes it
      - name: Install SDL3
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends libsdl3-0
          sudo ln -sf "$(ls /usr/lib/x86_64-linux-gnu/libSDL3.so.0)" /usr/local/lib/libSDL3.so
          sudo ldconfig
      - name: Fuzz the readers of models
        if: ${{ !cancelled() }}
        timeout-minutes: 50
        run: make build/sosuc && make fuzz-models FUZZ_TIME=600
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: build/fuzz_crashes
