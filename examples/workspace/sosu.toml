# A workspace in the manner of VS Code: a title bar drawn by the program, and every widget of
# `ui` (spec §10.4, §10.5).
[package]
name = "workspace"
version = "0.1.0"

[dependencies]
platform = { path = "../../packages/platform" }
render = { path = "../../packages/render" }
image = { path = "../../packages/image" }
ui = { path = "../../packages/ui" }
i18n = { path = "../../packages/i18n" }

# On a phone (spec §11.5): `sosuc package --target android examples/workspace`, from the repository
[app]
id = "org.sosu.workspace"
name = "Sosu workspace"
assets = ["../../packages/render/fonts/NotoSans-Regular.ttf", "assets/sosu.png", "locales"]
