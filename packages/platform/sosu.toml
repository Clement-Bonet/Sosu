# Window, events and drawing (spec §10), on SDL3.
# On Windows, run fetch-sdl3.ps1 once to download SDL3 into vendor/.
[package]
name = "platform"
version = "0.1.0"

[link]
libs = ["SDL3"]
subsystem = "window"  # its programs open windows: no console behind them in release, on Windows

[link.windows]
paths = ["vendor/SDL3/lib/x64"]
copy = ["vendor/SDL3/lib/x64/SDL3.dll"]

# Android (spec §11.5): run fetch-sdl3-android.ps1 once; `{abi}` is the folder of the target
[link.android]
paths = ["vendor/SDL3-android/lib/{abi}"]
copy = ["vendor/SDL3-android/lib/{abi}/libSDL3.so"]

[dependencies]
render = { path = "../render" }
