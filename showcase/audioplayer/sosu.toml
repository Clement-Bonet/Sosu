# Audio player: plays WAV, Ogg Vorbis, MP3 and FLAC files as they are read (audio.stream), and
# shows their spectrum (audio.spectrum, a Fourier transform), written in Sosu. The interface is
# described in src/screen.ui.sosu; the packages are those of this repository.
[package]
name = "audioplayer"
version = "0.1.0"

[app]
id = "org.sosu.audioplayer"
name = "Audio player"
assets = ["assets"]

[dependencies]
audio = { path = "../../packages/audio" }
platform = { path = "../../packages/platform" }
render = { path = "../../packages/render" }
image = { path = "../../packages/image" }
ui = { path = "../../packages/ui" }
testing = { path = "../../packages/testing" }
