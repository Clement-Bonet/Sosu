# Beatbox: a drum machine, written in Sosu. Its sounds are synthesized (no sample files), the
# interface is described in src/screen.ui.sosu, and the packages are those of this repository.
[package]
name = "beatbox"
version = "0.1.0"

# On a phone, the fonts are read from the application (`app.read_asset`), under the same path.
[app]
id = "org.sosu.beatbox"
name = "Beatbox"
assets = ["assets"]

[dependencies]
audio = { path = "../../packages/audio" }
platform = { path = "../../packages/platform" }
render = { path = "../../packages/render" }
image = { path = "../../packages/image" }
ui = { path = "../../packages/ui" }
testing = { path = "../../packages/testing" }
