# Queens: the puzzle of the queens and the coloured regions, written in Sosu. The rules are in src/board.sosu, with no window.
[package]
name = "queens"
version = "0.1.0"

[dependencies]
platform = { path = "../../packages/platform" }
render = { path = "../../packages/render" }
