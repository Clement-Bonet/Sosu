# Soundstage: a sound placed around the listener (ahead, behind, left, right, above) or turning
# around the head, heard through panning or through a head (audio.hrtf, for headphones), and drawn
# from above. The interface is described in src/screen.ui.sosu; the packages are those of this
# repository.
[package]
name = "soundstage"
version = "0.1.0"

[app]
id = "org.sosu.soundstage"
name = "Soundstage"
assets = ["assets"]

[dependencies]
audio = { path = "../../packages/audio" }
math = { path = "../../packages/math" }
platform = { path = "../../packages/platform" }
render = { path = "../../packages/render" }
image = { path = "../../packages/image" }
ui = { path = "../../packages/ui" }
testing = { path = "../../packages/testing" }
